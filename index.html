<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Clade</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="error" hidden></div>
  <div id="row">
    <aside id="sidebar">
      <div id="brand">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-6"/><path d="M10 12c0-4-5-3.5-5-8"/><path d="M10 12c0-4 5-3.5 5-8"/></svg>
        <span>Clade</span>
      </div>
      <button id="newchat" title="Start a new chat">New chat</button>
      <div id="chats"></div>
      <div id="acctwrap">
        <div id="acctmenu" hidden></div>
        <button id="acct" aria-haspopup="menu" aria-expanded="false">
          <span id="accticon" aria-hidden="true"></span>
          <span id="accttext">Signed in with Claude Code</span>
        </button>
      </div>
      <div id="sidegrip" role="separator" aria-orientation="vertical" aria-label="Chat list width" title="Drag to change the width. Double-click: back to 240." tabindex="0"></div>
    </aside>
    <div id="left"></div>
    <div id="center">
      <div id="bar">
        <button id="sidetoggle" class="barbtn" title="Show or hide the chat list" aria-label="Chat list">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
        </button>
        <span id="chattitle"></span>
        <span id="treenote"></span>
        <span id="zoombadge" hidden></span>
        <button id="graphbtn" class="barbtn" title="Reply graph of this chat (Cmd+G, or pinch out on the chat)">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3" r="1.5"/><circle cx="4.5" cy="13" r="1.5"/><circle cx="11.5" cy="5" r="1.5"/><path d="M4.5 4.5v7"/><path d="M11.5 6.5c0 3-7 2.5-7 5"/></svg>
          <span>Graph</span>
        </button>
      </div>
      <div id="chat">
        <div id="msgwrap">
          <div id="messages">
            <div id="items"></div>
            <div id="working" hidden><span class="dots"><i></i><i></i><i></i></span><span>Claude is working. If nothing happens, press Cmd+J to see the terminal.</span></div>
          </div>
          <div id="rail" hidden></div>
        </div>
        <div id="cardswrap"><div id="cards"></div></div>
        <div id="composerwrap">
          <button id="jump" hidden title="Jump to the latest message" aria-label="Jump to latest">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10"/><path d="M3.5 8.5 8 13l4.5-4.5"/></svg>
          </button>
          <div id="note" hidden></div>
          <div id="composer">
            <div id="chips"></div>
            <textarea id="input" rows="1" placeholder="Message Claude"></textarea>
            <div id="controls">
              <button id="attach" class="ctl" title="Attach files (Cmd+U). You can also drop files on the window or paste an image." aria-label="Attach files">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7.5 8 12.5a3.2 3.2 0 0 1-4.5-4.5l5.5-5.5a2.1 2.1 0 0 1 3 3L6.6 10.9a1 1 0 0 1-1.5-1.5L10 4.5"/></svg>
              </button>
              <button id="modebtn" class="ctl pick"></button>
              <button id="effortbtn" class="ctl pick"></button>
              <button id="skillsbtn" class="ctl pick" title="Skills Claude Code can see (Cmd+Shift+K)"><span>Skills</span></button>
              <span class="grow"></span>
              <button id="modelbtn" class="ctl pick"></button>
              <button id="send" aria-label="Send" disabled></button>
            </div>
          </div>
          <div id="popover" hidden></div>
        </div>
      </div>
      <div id="bottom"></div>
      <div id="term"></div>
    </div>
    <div id="artifact" hidden>
      <div id="artgrip"></div>
      <div id="arthead">
        <span id="arttitle"></span>
        <button id="artprev" class="barbtn" title="Older version" aria-label="Older version">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <span id="artver"></span>
        <button id="artnext" class="barbtn" title="Newer version" aria-label="Newer version">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
        </button>
        <button id="artreload" class="barbtn" title="Reload">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2v3h-3"/></svg>
        </button>
        <button id="artreveal" class="barbtn" title="Show the file in Finder">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>
        </button>
        <button id="artclose" class="barbtn" title="Close" aria-label="Close">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div id="artnote"></div>
      <div id="artifactbody"></div>
    </div>
    <div id="right"></div>
    <div id="settings" hidden><div id="sheet"></div></div>
    <div id="graphview" hidden>
      <div id="graphhead">
        <span>Drag or scroll to move · Cmd+scroll to zoom · pinch in on a reply or click it to open it · Esc to close</span>
        <button id="graphclose" class="barbtn">Close</button>
      </div>
      <svg id="graphsvg"></svg>
      <div id="graphpop" hidden></div>
    </div>
  </div>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/katex/dist/katex.min.js"></script>
  <script src="dist/timeleft.js"></script>
  <script src="dist/pinch.js"></script>
  <script src="dist/markup.js"></script>
  <script src="dist/composer.js"></script>
  <script src="dist/stream.js"></script>
  <script src="dist/usage.js"></script>
  <script src="dist/highlight.js"></script>
  <script src="dist/draw.js"></script>
  <script src="dist/md.js"></script>
  <script src="dist/diagrams.js"></script>
  <script src="dist/renderer.js"></script>
</body>
</html>
