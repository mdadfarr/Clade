<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>claude</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 13px -apple-system, sans-serif; overflow: hidden; }
  #error { background: #b00020; color: #fff; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #row { flex: 1; display: flex; min-height: 0; }
  #left, #right { display: flex; }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; font-family: var(--chat-font); font-size: var(--chat-size); }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 16px; }
  #items, #working, #input { max-width: var(--chat-width); margin: 0 auto; box-sizing: border-box; }
  #items { display: flex; flex-direction: column; gap: 8px; }
  .user, .claude { padding: 8px 12px; border-radius: 10px; max-width: 80%; min-width: 0; box-sizing: border-box; overflow-wrap: anywhere; font-size: var(--body-size); flex-shrink: 0; }
  .user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg); white-space: pre-wrap; }
  .claude { align-self: flex-start; background: var(--claude-bg); color: var(--claude-fg); }
  .tool { align-self: flex-start; color: #888; font-size: 0.8em; }
  .claude > :first-child { margin-top: 0; }
  .claude > :last-child { margin-bottom: 0; }
  .claude p { margin: 0.5em 0; white-space: pre-wrap; }
  .claude h1, .claude h2, .claude h3 { margin: 0.7em 0 0.3em; line-height: 1.25; }
  .claude h1 { font-size: var(--h1-size); font-weight: var(--h1-weight); color: var(--h1-color); }
  .claude h2 { font-size: var(--h2-size); font-weight: var(--h2-weight); color: var(--h2-color); }
  .claude h3 { font-size: var(--h3-size); font-weight: var(--h3-weight); color: var(--h3-color); }
  .claude b { color: var(--bold-color); }
  .claude ul, .claude ol { margin: 0.4em 0; padding-left: 1.5em; }
  .claude pre, .claude code { font-family: Menlo, monospace; font-size: 0.9em; background: var(--code-bg); border-radius: 4px; }
  .claude pre { padding: 8px; overflow-x: auto; }
  .claude code { padding: 1px 4px; }
  .mathblock { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  #working { color: #888; padding-top: 8px; }
  .reply { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .notice { color: #888; font-size: 0.8em; }
  .actions { display: flex; gap: 2px; margin-top: -4px; opacity: 0.25; transition: opacity 0.15s; }
  .reply:hover .actions, .actions:focus-within, .actions.newest { opacity: 1; }
  .act { display: flex; padding: 3px 4px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; }
  .act:hover { background: rgba(127,127,127,0.2); }
  .act[aria-disabled=true] { opacity: 0.4; cursor: default; background: none; }
  .act.done { color: #4caf50; }
  #note { max-width: var(--chat-width); margin: 0 auto 6px; padding: 0 12px; box-sizing: border-box; color: #e8a33d; }
  #input { display: block; flex-shrink: 0; width: calc(100% - 24px); margin-bottom: 8px; padding: 8px 10px; font: inherit; border: 1px solid #666; border-radius: 8px; background: rgba(0,0,0,0.25); color: inherit; outline: none; }

  #term { height: 40vh; flex-shrink: 0; margin: 0 8px 8px; padding: 4px; overflow: hidden; }
  /* Hidden by default (Cmd+J shows it). Kept off-screen at a real size so claude still gets a sane width. */
  body:not(.showterm) #term { position: absolute; left: -10000px; top: 0; width: calc(100vw - 280px); height: 170px; margin: 0; }

  #cards { max-width: var(--chat-width); width: 100%; margin: 0 auto; padding: 0 12px; box-sizing: border-box; flex-shrink: 0; max-height: 55vh; overflow-y: auto; }
  #cards:empty { display: none; }
  .card { background: var(--claude-bg); color: var(--claude-fg); border: 1px solid rgba(127,127,127,0.5); border-radius: 10px; padding: 10px 12px; font-size: var(--body-size); }
  .card-title { font-weight: 600; margin-bottom: 4px; }
  .card-label { font-size: 0.8em; opacity: 0.7; margin-top: 4px; }
  .card-target, .card-preview { font-family: Menlo, monospace; font-size: 0.85em; background: var(--code-bg); border-radius: 4px; padding: 6px 8px; margin: 2px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card-preview { max-height: 200px; overflow: auto; }
  .card-preview .del { color: #ff8a80; }
  .card-preview .ins { color: #9be59b; }
  .card-preview .more { opacity: 0.6; }
  .card-note { font-size: 0.85em; opacity: 0.8; margin: 2px 0 6px; white-space: pre-wrap; }
  .card-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .card-btn, .q-option { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.6); background: rgba(127,127,127,0.15); color: inherit; cursor: pointer; }
  .card-btn:hover, .q-option:hover { background: rgba(127,127,127,0.3); }
  .card-btn.allow { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  .card-btn.deny { background: #b3261e; border-color: #b3261e; color: #fff; }
  .card-btn.always { font-family: Menlo, monospace; font-size: 0.85em; }
  .card-reason { flex: 1; min-width: 120px; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #666; background: rgba(0,0,0,0.25); color: inherit; outline: none; }
  .card button:disabled, .card.sent button, .card.sent input, .card.expired button, .card.expired input { opacity: 0.4; cursor: default; pointer-events: none; }
  .question { margin: 6px 0; }
  .q-header { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; }
  .q-text { margin: 2px 0 6px; font-weight: 600; }
  .q-options { display: flex; flex-direction: column; gap: 4px; }
  .q-option { display: flex; flex-direction: column; text-align: left; }
  .q-option.chosen { outline: 2px solid rgba(200,200,200,0.6); }
  .q-desc { font-size: 0.8em; opacity: 0.75; }
  .card-expired { display: none; color: var(--timer-urgent); font-weight: 600; margin-top: 8px; }
  .card.expired .card-expired { display: block; }
  .timer-track { height: 3px; margin-top: 10px; border-radius: 1.5px; background: var(--timer-track); overflow: hidden; display: flex; justify-content: flex-end; }
  .timer-fill { height: 100%; border-radius: 1.5px; transition: width 0.25s linear, background-color 0.25s; }
  .card-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 0.75em; color: #8a8a8a; }
  .timer-text { font-variant-numeric: tabular-nums; margin-left: auto; }
  #cards > :last-child { margin-bottom: 8px; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 12px 0; font: 12px -apple-system, sans-serif; }
  #bar button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.5); background: rgba(127,127,127,0.12); color: inherit; cursor: pointer; }
  #bar button:disabled { opacity: 0.4; cursor: default; }
  #treenote { color: #c88; }
  #row { position: relative; }
  #graphview { position: absolute; inset: 0; z-index: 10; background: var(--window-bg, #2b2b2b); display: flex; flex-direction: column; }
  #graphview[hidden] { display: none; }
  #graphhead { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font: 12px -apple-system, sans-serif; color: #8a8a8a; }
  #graphhead button { margin-left: auto; font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.5); background: rgba(127,127,127,0.12); color: #ccc; cursor: pointer; }
  #graphsvg { flex: 1; width: 100%; min-height: 0; cursor: grab; touch-action: none; user-select: none; }
  #graphsvg:active { cursor: grabbing; }
  .gline { fill: none; stroke: var(--graph-line); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .gnode { cursor: pointer; }
  .gnode rect { fill: var(--graph-node); }
  .gnode:hover rect { fill: var(--graph-current); }
  .gnode.current rect { fill: var(--graph-current); stroke: var(--graph-label); stroke-opacity: 0.35; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .gnode text { fill: var(--graph-label); font: 11px -apple-system, sans-serif; pointer-events: none; }
  #graphpop { position: absolute; max-width: 320px; padding: 8px 10px; border-radius: 8px; background: #333; color: #ddd; font: 12px -apple-system, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  .gfirst { margin-bottom: 6px; overflow-wrap: anywhere; }
  .gbranch { font: inherit; padding: 3px 8px; border-radius: 5px; border: 1px solid rgba(127,127,127,0.5); background: rgba(127,127,127,0.15); color: inherit; cursor: pointer; }
  .gbranch:disabled { opacity: 0.4; cursor: default; }
  .reply.flash > .claude { outline: 1px solid rgba(200,200,200,0.5); }
  .panel { padding: 8px 12px; overflow: auto; box-sizing: border-box; flex-shrink: 0; }
  .panel h3 { margin: 4px 0 8px; }
  .panel ul { padding-left: 18px; margin: 4px 0; }
</style>
</head>
<body>
  <div id="error" hidden></div>
  <div id="row">
    <div id="left"></div>
    <div id="center">
      <div id="bar">
        <button id="graphbtn" title="Reply graph (Cmd+G)">Graph</button>
        <button id="branch" disabled>Branch</button>
        <span id="treenote"></span>
      </div>
      <div id="chat">
        <div id="messages">
          <div id="items"></div>
          <div id="working" hidden>Claude is working... (if nothing happens, press Cmd+J to see the terminal)</div>
        </div>
        <div id="cards"></div>
        <div id="note" hidden></div>
        <input id="input" placeholder="Message Claude, then press Enter">
      </div>
      <div id="bottom"></div>
      <div id="term"></div>
    </div>
    <div id="right"></div>
    <div id="graphview" hidden>
      <div id="graphhead">
        <span>Drag to move · pinch or Cmd+scroll to zoom · click a reply to open it · Esc to close</span>
        <button id="graphclose">Close</button>
      </div>
      <svg id="graphsvg"></svg>
      <div id="graphpop" hidden></div>
    </div>
  </div>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/katex/dist/katex.min.js"></script>
  <script src="dist/timeleft.js"></script>
  <script src="dist/renderer.js"></script>
</body>
</html>
